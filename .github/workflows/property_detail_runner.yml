name: Property Detail Scraper

on:
  workflow_dispatch:
    inputs:
      source_csv:
        description: "CSV file with property URLs (aggregated dataset with ~56K URLs)"
        required: false
        default: data/raw/sold_properties_all_areas.csv
        type: string
      max_records:
        description: "Maximum records to scrape (0 = all unprocessed URLs, skipping cached)"
        required: false
        default: 0
        type: number
      offset:
        description: "Number of rows to skip before scraping"
        required: false
        default: 0
        type: number
      batch_size:
        description: "Properties per batch"
        required: false
        default: 5
        type: number
      headless:
        description: "Run browser in headless mode"
        required: false
        default: true
        type: boolean
      log_level:
        description: "Log level for CLI"
        required: false
        default: INFO
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING
  schedule:
    # Offset by 30 minutes from link scraping cadence
    - cron: '30 0,6,12,18 * * *'

permissions:
  contents: write

concurrency:
  group: property-detail-runner
  cancel-in-progress: false

jobs:
  scrape-details:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      SCRAPE_OUTPUT: data/gha_property_batches
      SUBSET_CSV: data/tmp/gha_property_subset.csv
      PROCESSED_ROOT: data/processed/property_details/gha_runs
      RUN_INDEX: data/processed/property_details/gha_runs/index.jsonl
      INPUT_SOURCE_CSV: ${{ inputs.source_csv || 'data/raw/sold_properties_all_areas.csv' }}
      INPUT_OFFSET: ${{ inputs.offset || 0 }}
      INPUT_MAX_RECORDS: ${{ inputs.max_records || 0 }}
      INPUT_BATCH_SIZE: ${{ inputs.batch_size || 5 }}
      INPUT_HEADLESS: ${{ inputs.headless || true }}
      INPUT_LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
      HEMNET_DETAIL_MIN_DELAY_SECONDS: 4
      HEMNET_DETAIL_MAX_DELAY_SECONDS: 8
      PROPERTY_DETAIL_COMMIT_INTERVAL: 0 # Disable intermediate commits
      PROGRESS_CACHE: data/processed/property_details/progress_cache.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install project dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[scraping,data]"

      - name: Install Playwright browsers
        run: |
          source .venv/bin/activate
          playwright install chromium --with-deps

      - name: Start virtual display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Capture run timestamp
        id: run_timestamp
        run: echo "utc=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Prepare directories
        env:
          RUN_TIMESTAMP: ${{ steps.run_timestamp.outputs.utc }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SUBSET_CSV")"
          mkdir -p "$PROCESSED_ROOT"
          if [ -z "$RUN_TIMESTAMP" ]; then
            echo "RUN_TIMESTAMP missing"
            exit 1
          fi
          run_dir="$PROCESSED_ROOT/$RUN_TIMESTAMP"
          if [ -d "$run_dir" ]; then
            idx=1
            while [ -d "${run_dir}-retry${idx}" ]; do
              idx=$((idx+1))
            done
            run_dir="${run_dir}-retry${idx}"
          fi
          mkdir -p "$run_dir"
          echo "RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          echo "SCRAPE_OUTPUT=$run_dir" >> "$GITHUB_ENV"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run batch scraper
        id: scrape
        env:
          DISPLAY: ${{ env.DISPLAY }}
        run: |
          source .venv/bin/activate
          HEADLESS_FLAG="$INPUT_HEADLESS"
          EXTRA_FLAGS=""
          if [ "$HEADLESS_FLAG" = 'false' ]; then
            EXTRA_FLAGS="--show-browser"
          fi
          uv run python -m src.scrapers.batch_manager_cli \
            --input "$INPUT_SOURCE_CSV" \
            --output-dir "$SCRAPE_OUTPUT" \
            --batch-size "$INPUT_BATCH_SIZE" \
            --offset "$INPUT_OFFSET" \
            --max-records "$INPUT_MAX_RECORDS" \
            --subset-output "$SUBSET_CSV" \
            --log-level "$INPUT_LOG_LEVEL" \
            --git-commit-interval "$PROPERTY_DETAIL_COMMIT_INTERVAL" \
            --progress-cache "$PROGRESS_CACHE" \
            $EXTRA_FLAGS

      - name: Summarize results
        if: always()
        id: summary
        run: |
          source .venv/bin/activate
          uv run python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          metadata_path = pathlib.Path(os.environ["SCRAPE_OUTPUT"]) / "metadata.json"
          subset_path = pathlib.Path(os.environ["SUBSET_CSV"]).resolve()
          progress_cache_path = pathlib.Path(os.environ["PROGRESS_CACHE"]).resolve()

          summary_lines = ["## Property detail scrape"]
          
          # Show progress cache stats
          if progress_cache_path.exists():
              try:
                  cache_data = json.loads(progress_cache_path.read_text())
                  cache_count = len(cache_data.get("identifiers", []))
                  summary_lines.append(f"- **Progress cache**: {cache_count} URLs already scraped")
              except Exception:
                  summary_lines.append("- Progress cache error: could not read cache file")
          else:
              summary_lines.append("- Progress cache: not found (starting fresh)")

          if not metadata_path.exists():
              summary_lines.append("- ⚠️ No metadata found (no new URLs to scrape)")
              print("\n".join(summary_lines), file=sys.stderr)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write("\n".join(summary_lines) + "\n")
              sys.exit(0)

          metadata = json.loads(metadata_path.read_text())
          summary_lines.extend([
              f"- Source CSV: `{os.environ['INPUT_SOURCE_CSV']}`",
              f"- Offset: {os.environ['INPUT_OFFSET']}",
              f"- Max records: {os.environ['INPUT_MAX_RECORDS']} (0 = all unprocessed)",
              f"- **Processed this run**: {metadata.get('total_processed', 0)}",
              f"- **Successful**: {metadata.get('total_successful', 0)}",
              f"- **Failed**: {metadata.get('total_failed', 0)}",
              f"- Output dir: `{metadata_path.parent}`",
          ])
          print("\n".join(summary_lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(summary_lines) + "\n")
          PY

      - name: Record run outputs
        if: ${{ success() }}
        env:
          RUN_TIMESTAMP: ${{ steps.run_timestamp.outputs.utc }}
        run: |
          set -euo pipefail
          source .venv/bin/activate
          if [ -z "${RUN_DIR:-}" ]; then
            echo "RUN_DIR not exported; aborting."
            exit 1
          fi
          metadata_path="$RUN_DIR/metadata.json"
          if [ ! -f "$metadata_path" ]; then
            echo "No metadata generated; skipping persistence."
            exit 0
          fi
          uv run python - <<'PY'
          import json
          import os
          import pathlib

          run_dir = pathlib.Path(os.environ["RUN_DIR"])
          metadata_path = run_dir / "metadata.json"
          if not metadata_path.exists():
              raise SystemExit("Persisted metadata missing; cannot update index.")

          metadata = json.loads(metadata_path.read_text())
          index_path = pathlib.Path(os.environ["RUN_INDEX"])
          index_path.parent.mkdir(parents=True, exist_ok=True)
          
          # Get progress cache count
          progress_cache_path = pathlib.Path(os.environ["PROGRESS_CACHE"])
          total_scraped = 0
          if progress_cache_path.exists():
              try:
                  cache_data = json.loads(progress_cache_path.read_text())
                  total_scraped = len(cache_data.get("identifiers", []))
              except Exception:
                  # Cache file may be corrupted or malformed; ignore and use 0
                  pass

          record = {
              "run_id": os.environ["GITHUB_RUN_ID"],
              "timestamp": os.environ["RUN_TIMESTAMP"],
              "source_csv": os.environ["INPUT_SOURCE_CSV"],
              "offset": int(float(os.environ["INPUT_OFFSET"])),
              "max_records": int(float(os.environ["INPUT_MAX_RECORDS"])),
              "batch_size": int(float(os.environ["INPUT_BATCH_SIZE"])),
              "processed": metadata.get("total_processed", 0),
              "successful": metadata.get("total_successful", 0),
              "failed": metadata.get("total_failed", 0),
              "total_scraped_to_date": total_scraped,
              "output_path": str(run_dir),
              "artifact_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }

          with index_path.open("a", encoding="utf-8") as fh:
              fh.write(json.dumps(record) + "\n")
          PY

      - name: Update DuckDB database
        if: ${{ success() }}
        run: |
          source .venv/bin/activate
          python src/data/aggregate_properties.py

      - name: Commit and push changes
        if: ${{ success() }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: property details ${RUN_TIMESTAMP} (${INPUT_SOURCE_CSV} offset=${INPUT_OFFSET})"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          file_pattern: 'data/processed/property_details/**'
          commit_options: '--no-verify'
          skip_fetch: false
          skip_checkout: false

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-detail-output-${{ github.run_id }}
          path: |
            ${{ env.SCRAPE_OUTPUT }}/**
            ${{ env.SUBSET_CSV }}
            /tmp/xvfb.log
          retention-days: 7
