name: Scrape Sold Properties (National Weekly)

on:
  schedule:
    # Run once a week on Sunday at 2 AM
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      run_scope:
        description: 'Run scope'
        required: false
        type: choice
        options: [national, region, city]
        default: national
      location_id:
        description: 'Hemnet location ID (required for city scope)'
        required: false
        type: string
        default: ''
      sold_age:
        description: 'Sold age window (1m, 3m, 6m, 12m)'
        required: false
        type: string
        default: '1m'
      test_mode:
        description: 'Test mode (only 2 pages)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: scrape-sold-national
  cancel-in-progress: false

jobs:
  scrape-sold-national:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HEMNET_SOLD_MIN_DELAY_SECONDS: 4
      HEMNET_SOLD_MAX_DELAY_SECONDS: 8
      BLOB_WRITE_ENABLED: ${{ vars.BLOB_WRITE_ENABLED || 'false' }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME || '' }}
      BLOB_CONTAINER: ${{ vars.BLOB_CONTAINER || '' }}
      BLOB_PREFIX: ${{ vars.BLOB_PREFIX || 'sweden-housing' }}
      BLOB_PROCESSED_PREFIX: ${{ vars.BLOB_PROCESSED_PREFIX || 'processed' }}
      BLOB_MODELS_PREFIX: models
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      INPUT_RUN_SCOPE: ${{ inputs.run_scope || 'national' }}
      INPUT_LOCATION_ID: ${{ inputs.location_id || '' }}
      INPUT_SOLD_AGE: ${{ inputs.sold_age || '1m' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies with uv
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[scraping]"
      
      - name: Install Playwright and browsers
        run: |
          source .venv/bin/activate
          playwright install chromium --with-deps
      
      - name: Setup virtual display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 3
          echo "DISPLAY=:99" >> $GITHUB_ENV
      
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate run scope inputs
        run: |
          if [ "$INPUT_RUN_SCOPE" != "national" ] && [ -z "$INPUT_LOCATION_ID" ]; then
            echo "$INPUT_RUN_SCOPE scope requires location_id"
            exit 1
          fi
      
      - name: Run adaptive area scraper for national recent sales
        run: |
          source .venv/bin/activate

          LOCATION_FLAG=""
          if [ -n "$INPUT_LOCATION_ID" ]; then
            LOCATION_FLAG="--location-id $INPUT_LOCATION_ID"
          fi

          CMD="python scripts/scrape_all_areas.py --sold-age $INPUT_SOLD_AGE --headless --output-dir data/raw/area_ranges_national $LOCATION_FLAG"
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            CMD="$CMD --max-pages 2 --min-area 80 --max-area 85"
          fi
          
          echo "Running: $CMD"
          eval $CMD || {
            echo "❌ Scraping failed"
            git add data/raw/area_ranges_national/*.csv data/raw/area_ranges_national/*.json data/.hemnet_session.json 2>/dev/null || true
            git diff --staged --quiet || git commit -m "data: partial national sold scrape (failed)"
            git push || true
            exit 1
          }
        env:
          DISPLAY: ${{ env.DISPLAY }}
          CI: "true"

      - name: Consolidate and Append to master list
        run: |
          # The scraper consolidates into data/raw/sold_properties_all_areas.csv by default,
          # but since we output to area_ranges_national, we need to manually consolidate or let the script do it.
          # We'll just run consolidate with python to append to our main sold_properties_all_areas.csv
          source .venv/bin/activate
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          new_files = list(Path('data/raw/area_ranges_national').glob('properties_*.csv'))
          if not new_files:
            print('No files found')
            raise SystemExit(0)

          new_df = pd.concat([pd.read_csv(f) for f in new_files])
          main_file = Path('data/raw/sold_properties_all_areas.csv')
          if main_file.exists():
            main_df = pd.read_csv(main_file)
            combined = pd.concat([main_df, new_df]).drop_duplicates(subset=['property_id'], keep='last')
          else:
            combined = new_df

          combined.to_csv(main_file, index=False)
          print(f'Done combining. Total rows: {len(combined)}')
          PY
      - name: Push results
        run: |
          git pull origin main || true
          git add data/raw/area_ranges_national/*.csv data/raw/area_ranges_national/*.json data/raw/sold_properties_all_areas.csv data/.hemnet_session.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "data: append weekly national sold properties"
            git push
          fi

      - name: Azure login (OIDC)
        if: env.BLOB_WRITE_ENABLED == 'true' && env.AZURE_STORAGE_ACCOUNT_NAME != '' && env.BLOB_CONTAINER != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Upload sold artifacts to Azure Blob (OIDC)
        if: env.BLOB_WRITE_ENABLED == 'true' && env.AZURE_STORAGE_ACCOUNT_NAME != '' && env.BLOB_CONTAINER != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        run: |
          set -euo pipefail
          RUN_DATE="$(date -u +%Y%m%d)"
          RUN_DATE_PARTITION="${RUN_DATE:0:4}-${RUN_DATE:4:2}-${RUN_DATE:6:2}"

          if [ -d "data/raw/area_ranges_national" ]; then
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
              --destination "$BLOB_CONTAINER" \
              --destination-path "$BLOB_PREFIX/$BLOB_PROCESSED_PREFIX/sold_links/run_date=$RUN_DATE_PARTITION/area_ranges_national" \
              --source "data/raw/area_ranges_national" \
              --overwrite true \
              --auth-mode login
          else
            echo "No area_ranges_national directory found; skipping area ranges upload"
          fi

          if [ -f "data/raw/sold_properties_all_areas.csv" ]; then
            az storage blob upload \
              --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
              --container-name "$BLOB_CONTAINER" \
              --name "$BLOB_PREFIX/$BLOB_PROCESSED_PREFIX/sold_links/run_date=$RUN_DATE_PARTITION/sold_properties_all_areas.csv" \
              --file "data/raw/sold_properties_all_areas.csv" \
              --overwrite true \
              --auth-mode login
          else
            echo "No sold_properties_all_areas.csv found; skipping consolidated upload"
          fi

      - name: Blob export skipped notice
        if: always() && !(env.BLOB_WRITE_ENABLED == 'true' && env.AZURE_STORAGE_ACCOUNT_NAME != '' && env.BLOB_CONTAINER != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '')
        run: |
          echo "Blob export skipped. Ensure BLOB_WRITE_ENABLED=true, AZURE_STORAGE_ACCOUNT_NAME, BLOB_CONTAINER, and OIDC secrets are configured."
