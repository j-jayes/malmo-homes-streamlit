name: "LEGACY (manual only): Weekly Property Scraping"

on:
  workflow_dispatch: # Legacy manual-only trigger
    inputs:
      confirm_legacy_run:
        description: "Type EXACTLY 'RUN_LEGACY_MALMO' to execute this legacy Malmö workflow"
        required: true
        default: ""
        type: string

permissions:
  contents: write # Required to commit and push changes
  id-token: write

jobs:
  scrape-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ~6 hour GitHub Actions limit, with margin
    env:
      BLOB_WRITE_ENABLED: ${{ vars.BLOB_WRITE_ENABLED || 'false' }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME || '' }}
      BLOB_CONTAINER: ${{ vars.BLOB_CONTAINER || '' }}
      BLOB_PREFIX: ${{ vars.BLOB_PREFIX || 'sweden-housing' }}
      BLOB_RAW_PREFIX: ${{ vars.BLOB_RAW_PREFIX || 'raw' }}
      BLOB_PROCESSED_PREFIX: ${{ vars.BLOB_PROCESSED_PREFIX || 'processed' }}
      BLOB_MODELS_PREFIX: models
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    steps:
      - name: Confirm legacy workflow execution
        run: |
          if [ "${{ github.event.inputs.confirm_legacy_run }}" != "RUN_LEGACY_MALMO" ]; then
            echo "Legacy Malmö workflow blocked. Provide confirm_legacy_run=RUN_LEGACY_MALMO to run intentionally."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for proper git operations
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Create virtual environment
        run: uv venv
      
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          # Install scraping and data dependencies
          uv pip install -e ".[scraping,data]"
          
      - name: Install Playwright browsers
        run: |
          source .venv/bin/activate
          playwright install chromium --with-deps
      
      - name: Setup virtual display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 3
          echo "DISPLAY=:99" >> $GITHUB_ENV
      
      - name: Collect property links (Malmö)
        run: |
          source .venv/bin/activate
          python src/scrapers/link_collector.py --location-id 17989 --max-pages 50 --headless --output data/raw/malmo_links_$(date +%Y%m%d).parquet
        continue-on-error: false
      
      - name: Scrape property details
        run: |
          source .venv/bin/activate
          # Use batch_manager_cli for robust scraping and Parquet output
          python -m src.scrapers.batch_manager_cli \
            --input data/raw/malmo_links_$(date +%Y%m%d).parquet \
            --output-dir data/processed/property_details/gha_runs/weekly_$(date +%Y%m%d) \
            --batch-size 10 \
            --log-level INFO
        continue-on-error: false
      
      # - name: Validate scraped data
      #   run: |
      #     source .venv/bin/activate
      #     python scripts/validate_data.py --input data/raw/malmo_properties_$(date +%Y%m%d).csv
      #   continue-on-error: true
      
      - name: Update DuckDB database
        run: |
          source .venv/bin/activate
          # Aggregate from the new output directory
          python src/data/aggregate_properties.py --input data/processed/property_details/gha_runs/weekly_$(date +%Y%m%d)
      
      - name: Pull latest changes
        run: git pull --rebase --autostash
      
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: weekly scrape $(date +%Y-%m-%d)"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          file_pattern: 'data/raw/*.csv data/processed/*.json data/database/*.duckdb data/database/*.parquet'
          commit_options: '--no-verify'
          skip_fetch: false
          skip_checkout: false

      - name: Azure login (OIDC)
        if: env.BLOB_WRITE_ENABLED == 'true' && env.AZURE_STORAGE_ACCOUNT_NAME != '' && env.BLOB_CONTAINER != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Upload legacy Malmö outputs to Azure Blob (OIDC)
        if: env.BLOB_WRITE_ENABLED == 'true' && env.AZURE_STORAGE_ACCOUNT_NAME != '' && env.BLOB_CONTAINER != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        run: |
          set -euo pipefail
          RUN_DATE="$(date -u +%Y%m%d)"
          RUN_DATE_PARTITION="${RUN_DATE:0:4}-${RUN_DATE:4:2}-${RUN_DATE:6:2}"

          LINKS_FILE="data/raw/malmo_links_${RUN_DATE}.parquet"
          DETAILS_DIR="data/processed/property_details/gha_runs/weekly_${RUN_DATE}"

          if [ -f "$LINKS_FILE" ]; then
            az storage blob upload \
              --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
              --container-name "$BLOB_CONTAINER" \
              --name "$BLOB_PREFIX/$BLOB_RAW_PREFIX/malmo_links/run_date=$RUN_DATE_PARTITION/$(basename "$LINKS_FILE")" \
              --file "$LINKS_FILE" \
              --overwrite true \
              --auth-mode login
          fi

          if [ -d "$DETAILS_DIR" ]; then
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
              --destination "$BLOB_CONTAINER" \
              --destination-path "$BLOB_PREFIX/$BLOB_PROCESSED_PREFIX/property_details_legacy/run_date=$RUN_DATE_PARTITION" \
              --source "$DETAILS_DIR" \
              --overwrite true \
              --auth-mode login
          fi

      - name: Blob export skipped notice
        if: always() && !(env.BLOB_WRITE_ENABLED == 'true' && env.AZURE_STORAGE_ACCOUNT_NAME != '' && env.BLOB_CONTAINER != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '')
        run: |
          echo "Blob export skipped. Ensure BLOB_WRITE_ENABLED=true, AZURE_STORAGE_ACCOUNT_NAME, BLOB_CONTAINER, and OIDC secrets are configured."
      
      - name: Upload scraping logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraping-logs-${{ github.run_number }}
          path: |
            logs/
            data/raw/malmo_properties_*.csv
          retention-days: 30
      
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Weekly scraping failed - ' + new Date().toISOString().split('T')[0],
              body: 'The weekly property scraping workflow failed. Check the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.',
              labels: ['automation', 'scraping', 'bug']
            })
