name: "Scrape Sold Properties (Monthly Backfill, manual)"

on:
  workflow_dispatch:
    inputs:
      run_scope:
        description: 'Run scope'
        required: false
        type: choice
        options: [national, region, city]
        default: national
      location_id:
        description: 'Hemnet location ID (required for city/region scope)'
        required: false
        type: string
        default: ''
      month:
        description: 'Month to scrape (YYYY-MM)'
        required: false
        default: ''
      test_mode:
        description: 'Test mode (only 2 pages)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  scrape-sold-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLOB_WRITE_ENABLED: ${{ vars.BLOB_WRITE_ENABLED || 'false' }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME || '' }}
      BLOB_CONTAINER: ${{ vars.BLOB_CONTAINER || '' }}
      BLOB_PREFIX: ${{ vars.BLOB_PREFIX || 'sweden-housing' }}
      BLOB_PROCESSED_PREFIX: ${{ vars.BLOB_PROCESSED_PREFIX || 'processed' }}
      BLOB_MODELS_PREFIX: models
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      INPUT_RUN_SCOPE: ${{ inputs.run_scope || 'national' }}
      INPUT_LOCATION_ID: ${{ inputs.location_id || '' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies with uv
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[scraping,data]"
      
      - name: Install Playwright and browsers
        run: |
          source .venv/bin/activate
          playwright install chromium --with-deps
      
      - name: Setup virtual display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # Start Xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 3
          echo "DISPLAY=:99" >> $GITHUB_ENV
      
      - name: Determine month to scrape
        id: month
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            MONTH="${{ github.event.inputs.month }}"
          else
            # Get last month (YYYY-MM)
            MONTH=$(date -d "last month" +%Y-%m)
          fi
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "Scraping month: $MONTH"

      - name: Validate run scope inputs
        run: |
          if [ "$INPUT_RUN_SCOPE" != "national" ] && [ -z "$INPUT_LOCATION_ID" ]; then
            echo "$INPUT_RUN_SCOPE scope requires location_id"
            exit 1
          fi
      
      - name: Run scraper
        run: |
          source .venv/bin/activate

          LOCATION_FLAG=""
          if [ -n "$INPUT_LOCATION_ID" ]; then
            LOCATION_FLAG="--location-id $INPUT_LOCATION_ID"
          fi
          
          # Build command
          CMD="python src/scrapers/sold_properties_scraper.py --month ${{ steps.month.outputs.month }} --headless $LOCATION_FLAG"
          
          # Add test flag if needed
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            CMD="$CMD --test"
          fi
          
          # Run the scraper
          echo "Running: $CMD"
          $CMD
        env:
          DISPLAY: ${{ env.DISPLAY }}
      
      - name: Check output file
        run: |
          MONTH=${{ steps.month.outputs.month }}
          FILE="data/raw/sold_properties_${MONTH//-/}.parquet"
          
          if [ -f "$FILE" ]; then
            echo "✅ Output file created: $FILE"
            # Parquet is binary, so we can't just cat it, but we can check size
            ls -lh "$FILE"
          else
            echo "❌ Output file not found: $FILE"
            exit 1
          fi

      - name: Update DuckDB database
        run: |
          source .venv/bin/activate
          # Aggregate the new parquet file (by scanning data/raw)
          # Note: This might pick up other raw parquet files, which is probably what we want (consolidation)
          python src/data/aggregate_properties.py --input data/raw
      
      - name: Commit and push data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: add sold properties for ${{ steps.month.outputs.month }}"
          file_pattern: 'data/raw/sold_properties_*.parquet data/.hemnet_session.json'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Azure login (OIDC)
        if: env.BLOB_WRITE_ENABLED == 'true' && env.AZURE_STORAGE_ACCOUNT_NAME != '' && env.BLOB_CONTAINER != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Upload monthly sold artifact to Azure Blob (OIDC)
        if: env.BLOB_WRITE_ENABLED == 'true' && env.AZURE_STORAGE_ACCOUNT_NAME != '' && env.BLOB_CONTAINER != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        run: |
          set -euo pipefail
          MONTH="${{ steps.month.outputs.month }}"
          FILE="data/raw/sold_properties_${MONTH//-/}.parquet"
          RUN_DATE_PARTITION="${MONTH}-01"

          if [ -f "$FILE" ]; then
            az storage blob upload \
              --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
              --container-name "$BLOB_CONTAINER" \
              --name "$BLOB_PREFIX/$BLOB_PROCESSED_PREFIX/sold_links/run_date=$RUN_DATE_PARTITION/$(basename "$FILE")" \
              --file "$FILE" \
              --overwrite true \
              --auth-mode login
          else
            echo "No monthly sold parquet found; skipping blob upload"
          fi

      - name: Blob export skipped notice
        if: always() && !(env.BLOB_WRITE_ENABLED == 'true' && env.AZURE_STORAGE_ACCOUNT_NAME != '' && env.BLOB_CONTAINER != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '')
        run: |
          echo "Blob export skipped. Ensure BLOB_WRITE_ENABLED=true, AZURE_STORAGE_ACCOUNT_NAME, BLOB_CONTAINER, and OIDC secrets are configured."
      
      - name: Upload scraping logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sold-scraping-logs-${{ steps.month.outputs.month }}
          path: |
            data/raw/sold_properties_*.parquet
          retention-days: 30
      
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const month = '${{ steps.month.outputs.month }}';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Sold properties scraping failed for ${month}`,
              body: `The monthly sold properties scraping workflow failed for ${month}.\n\nCheck the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.\n\n**Next steps:**\n- Review the logs\n- Check if Cloudflare blocking occurred\n- Manually trigger the workflow with test mode\n- Consider running locally if the issue persists`,
              labels: ['automation', 'scraping', 'sold-properties', 'bug']
            })
