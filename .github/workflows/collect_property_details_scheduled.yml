name: Collect Property Details (Scheduled)

# Runs twice daily to scrape full property details for URLs collected by
# the sold-link workflows. Reads from sold_properties_all_areas.csv and
# tracks progress via a SHA-256 fingerprint cache so URLs are never
# re-scraped across runs.
#
# Pipeline position:
#   collect_sold_links_weekly  →  [this workflow]  →  DuckDB properties table
#   collect_sold_links_backfill →  [this workflow]

on:
  workflow_dispatch:
    inputs:
      source_csv:
        description: 'CSV file with property URLs'
        required: false
        default: data/raw/sold_properties_all_areas.csv
        type: string
      max_records:
        description: 'Max records to scrape (0 = all unprocessed)'
        required: false
        default: 0
        type: number
      offset:
        description: 'Skip N rows before scraping'
        required: false
        default: 0
        type: number
      batch_size:
        description: 'Properties per batch'
        required: false
        default: 5
        type: number
      headless:
        description: 'Run browser headlessly'
        required: false
        default: true
        type: boolean
      log_level:
        description: 'Log level'
        required: false
        default: INFO
        type: choice
        options: [DEBUG, INFO, WARNING]
  schedule:
    - cron: '30 0,12 * * *'  # 00:30 and 12:30 UTC daily

permissions:
  contents: write
  id-token: write

concurrency:
  group: collect-property-details
  cancel-in-progress: false

jobs:
  scrape-details:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
      SCRAPE_OUTPUT: data/gha_property_batches
      SUBSET_CSV: data/tmp/gha_property_subset.csv
      PROCESSED_ROOT: data/processed/property_details/gha_runs
      RUN_INDEX: data/processed/property_details/gha_runs/index.jsonl
      INPUT_SOURCE_CSV: ${{ inputs.source_csv || 'data/raw/sold_properties_all_areas.csv' }}
      INPUT_OFFSET: ${{ inputs.offset || 0 }}
      INPUT_MAX_RECORDS: ${{ inputs.max_records || 0 }}
      INPUT_BATCH_SIZE: ${{ inputs.batch_size || 5 }}
      INPUT_HEADLESS: ${{ inputs.headless || true }}
      INPUT_LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
      HEMNET_DETAIL_MIN_DELAY_SECONDS: 4
      HEMNET_DETAIL_MAX_DELAY_SECONDS: 8
      PROPERTY_DETAIL_COMMIT_INTERVAL: 20
      PROGRESS_CACHE: data/processed/property_details/progress_cache.json
      BLOB_WRITE_ENABLED: ${{ vars.BLOB_WRITE_ENABLED || 'false' }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME || '' }}
      BLOB_CONTAINER: ${{ vars.BLOB_CONTAINER || '' }}
      BLOB_PREFIX: ${{ vars.BLOB_PREFIX || 'sweden-housing' }}
      BLOB_PROCESSED_PREFIX: ${{ vars.BLOB_PROCESSED_PREFIX || 'processed' }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[scraping,data]"

      - name: Install Playwright
        run: |
          source .venv/bin/activate
          playwright install chromium --with-deps

      - name: Start virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Capture run timestamp
        id: run_timestamp
        run: echo "utc=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Prepare directories
        env:
          RUN_TIMESTAMP: ${{ steps.run_timestamp.outputs.utc }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SUBSET_CSV")"
          mkdir -p "$PROCESSED_ROOT"
          run_dir="$PROCESSED_ROOT/$RUN_TIMESTAMP"
          if [ -d "$run_dir" ]; then
            idx=1
            while [ -d "${run_dir}-retry${idx}" ]; do idx=$((idx+1)); done
            run_dir="${run_dir}-retry${idx}"
          fi
          mkdir -p "$run_dir"
          echo "RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          echo "SCRAPE_OUTPUT=$run_dir" >> "$GITHUB_ENV"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Scrape property details
        id: scrape
        env:
          DISPLAY: ${{ env.DISPLAY }}
        run: |
          source .venv/bin/activate
          HEADLESS_FLAG="$INPUT_HEADLESS"
          EXTRA_FLAGS=""
          if [ "$HEADLESS_FLAG" = 'false' ]; then EXTRA_FLAGS="--show-browser"; fi
          python -m src.scrapers.batch_manager_cli \
            --input "$INPUT_SOURCE_CSV" \
            --output-dir "$SCRAPE_OUTPUT" \
            --batch-size "$INPUT_BATCH_SIZE" \
            --offset "$INPUT_OFFSET" \
            --max-records "$INPUT_MAX_RECORDS" \
            --subset-output "$SUBSET_CSV" \
            --log-level "$INPUT_LOG_LEVEL" \
            --git-commit-interval "$PROPERTY_DETAIL_COMMIT_INTERVAL" \
            --progress-cache "$PROGRESS_CACHE" \
            $EXTRA_FLAGS

      - name: Summarise results
        if: always()
        id: summary
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import json, os, pathlib, sys

          metadata_path = pathlib.Path(os.environ["SCRAPE_OUTPUT"]) / "metadata.json"
          progress_cache_path = pathlib.Path(os.environ["PROGRESS_CACHE"])

          lines = ["## Property Detail Scrape"]
          if progress_cache_path.exists():
              try:
                  cache = json.loads(progress_cache_path.read_text())
                  lines.append(f"- **Progress cache**: {len(cache.get('identifiers', []))} URLs already scraped")
              except Exception:
                  lines.append("- Progress cache: could not read")

          if not metadata_path.exists():
              lines.append("- No new URLs processed this run")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                  fh.write("\n".join(lines) + "\n")
              sys.exit(0)

          meta = json.loads(metadata_path.read_text())
          lines += [
              f"- Source: `{os.environ['INPUT_SOURCE_CSV']}`",
              f"- Processed: {meta.get('total_processed', 0)}",
              f"- Successful: {meta.get('total_successful', 0)}",
              f"- Failed: {meta.get('total_failed', 0)}",
          ]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Record run to index
        if: success()
        env:
          RUN_TIMESTAMP: ${{ steps.run_timestamp.outputs.utc }}
        run: |
          set -euo pipefail
          source .venv/bin/activate
          if [ ! -f "$RUN_DIR/metadata.json" ]; then exit 0; fi
          python - <<'PY'
          import json, os, pathlib

          run_dir = pathlib.Path(os.environ["RUN_DIR"])
          meta = json.loads((run_dir / "metadata.json").read_text())
          index_path = pathlib.Path(os.environ["RUN_INDEX"])
          index_path.parent.mkdir(parents=True, exist_ok=True)

          progress_cache = pathlib.Path(os.environ["PROGRESS_CACHE"])
          total_scraped = 0
          if progress_cache.exists():
              try:
                  total_scraped = len(json.loads(progress_cache.read_text()).get("identifiers", []))
              except Exception:
                  pass

          record = {
              "run_id": os.environ["GITHUB_RUN_ID"],
              "timestamp": os.environ["RUN_TIMESTAMP"],
              "source_csv": os.environ["INPUT_SOURCE_CSV"],
              "offset": int(float(os.environ["INPUT_OFFSET"])),
              "max_records": int(float(os.environ["INPUT_MAX_RECORDS"])),
              "batch_size": int(float(os.environ["INPUT_BATCH_SIZE"])),
              "processed": meta.get("total_processed", 0),
              "successful": meta.get("total_successful", 0),
              "failed": meta.get("total_failed", 0),
              "total_scraped_to_date": total_scraped,
              "output_path": str(run_dir),
          }
          with index_path.open("a") as fh:
              fh.write(json.dumps(record) + "\n")
          PY

      - name: Update DuckDB database
        if: success()
        run: |
          source .venv/bin/activate
          python src/data/aggregate_properties.py

      - name: Match active listing descriptions to sold properties
        run: |
          source .venv/bin/activate
          python scripts/match_active_to_sold.py

      - name: Commit and push changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: property details ${{ steps.run_timestamp.outputs.utc }}"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          file_pattern: 'data/processed/property_details/**'
          commit_options: '--no-verify'

      - name: Azure login (OIDC)
        if: env.BLOB_WRITE_ENABLED == 'true' && env.AZURE_STORAGE_ACCOUNT_NAME != '' && env.BLOB_CONTAINER != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to Azure Blob
        if: env.BLOB_WRITE_ENABLED == 'true' && env.AZURE_STORAGE_ACCOUNT_NAME != '' && env.BLOB_CONTAINER != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        run: |
          set -euo pipefail
          RUN_DATE="$(date -u +%Y-%m-%d)"
          if [ -d "$SCRAPE_OUTPUT" ]; then
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
              --destination "$BLOB_CONTAINER" \
              --destination-path "$BLOB_PREFIX/$BLOB_PROCESSED_PREFIX/property_details/run_date=$RUN_DATE/run_id=$GITHUB_RUN_ID" \
              --source "$SCRAPE_OUTPUT" --overwrite true --auth-mode login
          fi
          for f in "$RUN_INDEX" "$PROGRESS_CACHE"; do
            [ -f "$f" ] && az storage blob upload \
              --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
              --container-name "$BLOB_CONTAINER" \
              --name "$BLOB_PREFIX/$BLOB_PROCESSED_PREFIX/property_details/$(basename $f)" \
              --file "$f" --overwrite true --auth-mode login
          done

      - name: Blob export skipped notice
        if: always() && !(env.BLOB_WRITE_ENABLED == 'true' && env.AZURE_STORAGE_ACCOUNT_NAME != '' && env.BLOB_CONTAINER != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '')
        run: echo "Blob export skipped — configure BLOB_WRITE_ENABLED and Azure secrets to enable."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-details-${{ github.run_id }}
          path: |
            ${{ env.SCRAPE_OUTPUT }}/**
            ${{ env.SUBSET_CSV }}
            /tmp/xvfb.log
          retention-days: 7
